<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>coloop</title>
  <meta name="color-scheme" content="dark light">
  <!-- Set the theme before first paint to avoid a flash of the wrong palette. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◴</span>
      <span class="title">coloop</span>
    </div>
    <nav id="crumbs" class="crumbs"><!-- breadcrumb trail rendered by app.js --></nav>
    <div class="actions">
      <button id="themeBtn" class="btn ghost icon-only" title="Toggle light / dark theme" aria-label="Toggle theme"></button>
      <button id="settingsBtn" class="btn ghost icon-only" title="Settings" aria-label="Settings"></button>
      <button id="reloadBtn" class="btn ghost icon-only" title="Reload config from disk" aria-label="Reload config"></button>
      <button id="refreshBtn" class="btn ghost icon-only" title="Refresh now" aria-label="Refresh"></button>
      <span id="poll" class="poll" title="Live polling indicator"></span>
    </div>
  </header>

  <main id="view" class="view"><!-- active screen rendered by app.js --></main>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
