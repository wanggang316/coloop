# the-loop configuration — copy to ~/.the-loop/config.yaml and edit.

# HTTP listen address for the Web UI + JSON API.
# Default is loopback-only (127.0.0.1:8765). Binding a non-loopback address
# exposes UNAUTHENTICATED task execution to the network, so only do that
# behind your own auth/reverse-proxy.
listen: "127.0.0.1:8765"

# Default shell interpreter for `type: shell` tasks. This must be just the
# interpreter PATH (e.g. /bin/sh or /bin/bash) — the-loop runs the command as
# `<shell> -c "<command>"`. Do NOT append "-c" here.
shell: /bin/sh

# Where run records and logs live. Defaults to the directory of this config.
# Layout: <data_dir>/runs/<task>/<id>/{meta.json,output.log}
data_dir: ~/.the-loop

# Run-record retention. After each run finishes, that task's old runs are pruned
# from disk. Both default to off (keep everything) so upgrades never silently
# drop history; set either or both. In-flight runs are never deleted.
max_runs: 50            # keep only the newest N runs per task (0 = unlimited)
# max_run_age: 720h     # also delete runs older than this duration (e.g. 30 days)

# Reusable agent command templates. Define a runner once here, then have agent
# tasks select it by name (task.runner) instead of repeating the command line.
# {{.Prompt}}, {{.TaskName}}, {{.WorkingDir}} and {{.Env}} are rendered; the
# prompt and task name are also exported as $PROMPT / $TASK_NAME.
#
# If you declare no runners, the two below are seeded automatically so the
# common agents show up ready to use (and editable/deletable). Both stream
# structured output so the live log shows progress instead of staying silent
# until the run ends. List them here to customise or pin them.
runners:
  - name: claude-code
    # the-loop runs agents unattended, so nobody is there to answer permission
    # prompts: --dangerously-skip-permissions lets the agent run shell/git/network
    # steps instead of silently stalling on approval. Swap in
    # --permission-mode acceptEdits to restrict it to file edits only.
    cmd_tmpl: 'claude -p "{{.Prompt}}" --output-format stream-json --verbose --dangerously-skip-permissions'
  - name: codex
    # --full-auto runs sandboxed with automatic approvals.
    cmd_tmpl: 'codex exec --json --full-auto "{{.Prompt}}"'

# Named alert channels. Define a channel once here, then list its name under a
# task's `notifiers:` to send that task's alerts there. A task with no
# `notifiers` alerts nobody (the `alert:` policy only decides whether to alert;
# `notifiers` decides where).
#
# Left commented so this file loads as-is — a channel is only valid once it has
# real credentials (feishu needs a webhook or cli_path; telegram needs a
# bot_token and chat_id). Uncomment, fill in, then reference the names below.
#
# The older single-channel `notifiers: {feishu: …, telegram: …}` block is still
# accepted: on load it is migrated into named channels "feishu"/"telegram".
# notifier_channels:
#   - name: team-feishu
#     type: feishu
#     feishu:
#       webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxx"
#       secret: ""        # webhook signing secret (optional)
#       # cli_path: ""    # alternatively, path to a feishu CLI binary
#   - name: my-telegram
#     type: telegram
#     telegram:
#       bot_token: "123456:ABC-DEF"
#       chat_id: "-1001234567890"
#       # api_base: "https://api.telegram.org"   # override (e.g. for testing)

tasks:
  # A scheduled local script.
  - name: db-backup
    type: shell
    cron: "0 3 * * *"            # standard 5-field cron; empty = manual only
    working_dir: ~/projects/api  # cwd the command runs in
    command: ./scripts/backup.sh
    env:
      ENV: prod
    timeout: 1h                  # parsed durations like 30s/10m/1h; default 1h
    alert: on_failure            # on_failure | on_success | always | never
    # notifiers: [team-feishu]   # channel name(s) from notifier_channels above

  # Invoke an agent. Pick a runner (defined above) instead of inlining the
  # command line; the runner's cmd_tmpl is rendered with this task's prompt.
  - name: agent-triage
    type: agent
    cron: "0 */2 * * *"
    working_dir: ~/projects/web
    runner: claude-code
    prompt: Inspect today's alert logs and summarize action items.
    alert: always
    # notifiers: [team-feishu, my-telegram]

  # A manual-only task (no cron); trigger from the UI or `the-loop run hello`.
  - name: hello
    type: shell
    command: echo "hello from the-loop"
    alert: never
